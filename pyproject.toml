[project]
name = "evision"
version = "1.0.0"
description = "Connected-vehicle analytics platform: FastAPI + PostgreSQL telemetry backend feeding Power BI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI Query()/Depends() defaults
    "E501",  # line length is handled by `ruff format`; long SQL literals are fine
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "simulator"]
