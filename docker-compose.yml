services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evision
      POSTGRES_PASSWORD: evision
      POSTGRES_DB: evision
    ports:
      - "5432:5432"   # Power BI Desktop connects here
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evision -d evision"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://evision:evision@db:5432/evision
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-at-least-32-characters}
      MODELS_DIR: /srv/ml/artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/srv/ml/artifacts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
